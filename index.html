<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>portfolio</title>
  </head>
  <body>
    <header>
      <h1>ヘッダーのh1</h1>
      <nav class="globa-nav"></nav>
    </header>
    <main>
      <section class="works">
        <h2 class="section-title"></h2>
      </section>
      <section class="profile">
        <h2 class="section-title"></h2>
      </section>
      <section class="favourites">
        <h2 class="section-title"></h2>
      </section>
      <section class="contact">
        <h2 class="section-title">お問い合わせ</h2>
        <form action="" method="post">
          <p>
            <label for="name" class="required">お名前</label>
            <input type="text" name="name" id="name" required />
          </p>
          <p>
            <label for="kana" class="required">ふりがな</label>
            <input type="text" name="kana" id="kana" required />
          </p>
          <p>
            <label for="company">会社名</label>
            <input type="text" name="company" id="company" />
          </p>
          <p>
            <label for="email" class="required">メールアドレス</label>
            <input type="email" name="email" id="email" />
          </p>
          <p>
            <label for="tel">お電話番号</label>
            <input type="tel" name="tel" id="tel" />
          </p>
          <p>
            <label for="detail" class="required">お問い合わせ内容</label>
            <textarea name="detail" id="detail" rows="6" required></textarea>
          </p>
          <input type="submit" value="送信する" />
        </form>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
